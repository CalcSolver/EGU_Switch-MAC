<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EGU Controller Engine</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; touch-action: none; }
        #canvas-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="stream-canvas"></canvas>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('stream-canvas');
        const ctx = canvas.getContext('2d');

        // Render stream frame adjusting dynamically to Retina pixel size
        socket.on('screen-frame', (frame) => {
            if (canvas.width !== frame.width || canvas.height !== frame.height) {
                canvas.width = frame.width;
                canvas.height = frame.height;
            }
            
            const imgData = new ImageData(new Uint8ClampedArray(frame.data), frame.width, frame.height);
            ctx.putImageData(imgData, 0, 0);
        });

        // Handle Touch Actions
        function handleTouch(e) {
            const rect = canvas.getBoundingClientRect();
            const xRatio = (e.touches[0].clientX - rect.left) / rect.width;
            const yRatio = (e.touches[0].clientY - rect.top) / rect.height;
            
            if (xRatio >= 0 && xRatio <= 1 && yRatio >= 0 && yRatio <= 1) {
                socket.emit('mouse-move', { x: xRatio, y: yRatio });
            }
        }

        window.addEventListener('touchmove', (e) => {
            if(e.touches.length === 1) {
                handleTouch(e);
            }
        }, { passive: false });

        window.addEventListener('touchstart', (e) => {
            if(e.touches.length === 1) {
                handleTouch(e);
                socket.emit('mouse-click');
            }
        });
    </script>
</body>
</html>
